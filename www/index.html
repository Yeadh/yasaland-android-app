<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#7ec8f5"><link rel="icon" href="icons/icon-192.png">
<title>YASA LAND - PLAY &amp; LEARN</title>
<style>
:root{--ac:#ff7043;--hud:rgba(255,255,255,.9);--tx:#3b2f1e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hud:rgba(30,40,30,.88);--tx:#f5ecd5}}
:root[data-theme="dark"]{--hud:rgba(30,40,30,.88);--tx:#f5ecd5}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:system-ui,"Noto Sans Bengali",sans-serif;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:var(--hud);color:var(--tx);border-radius:16px;padding:6px 14px;font-weight:800;font-size:clamp(17px,4.5vw,26px)}
.pill b{background:var(--ac);color:#fff;border-radius:10px;padding:0 10px;margin:0 3px}
#msg{position:fixed;top:64px;left:0;right:0;text-align:center;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none}
button{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:14px;padding:10px 18px;background:var(--ac);color:#fff}
#hb{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
#js{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.7);touch-action:none}
#kn{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:var(--ac);opacity:.9}
#ar{position:fixed;left:50%;top:110px;margin-left:-30px;font-size:60px;display:none;text-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;font-size:28px;font-weight:800;text-align:center;z-index:10;padding:20px}
.fx{position:fixed;font-size:34px;pointer-events:none;animation:fl 1.3s forwards;z-index:9}
@keyframes fl{to{transform:translateY(-160px) rotate(40deg);opacity:0}}
.cb{font-size:38px;padding:4px 10px;background:rgba(255,255,255,.25);border-radius:14px}.cb.on{background:var(--ac)}#cs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}@keyframes pp{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}#pic.s{animation:pp .5s}#st{background:linear-gradient(180deg,#7ec8f5 0%,#d4f1ff 36%,#a5d66a 36%,#6fb24a 100%);align-items:flex-start;justify-content:flex-start;overflow-y:auto;font-size:16px;font-weight:600;color:var(--tx);padding:14px;gap:0}
#st .card{margin:auto;width:100%;max-width:420px;background:var(--hud);border-radius:26px;padding:18px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;gap:10px}
#st .ttl{font-size:42px;font-weight:900;letter-spacing:1px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.12)}
#st .sub{font-size:14px;opacity:.8;text-align:center;font-weight:600}
#st .sec{align-self:flex-start;font-size:17px;font-weight:800;margin-top:6px;display:flex;align-items:center}
#st .sec .n{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:50%;background:var(--ac);color:#fff;text-align:center;margin-right:8px;font-size:14px;flex:none}
#st .row{display:flex;gap:8px;width:100%}
#st .cb{background:rgba(0,0,0,.07);color:var(--tx);border:3px solid transparent;border-radius:16px;font-weight:800}
#st .cb.on{background:var(--ac);color:#fff;border-color:#fff;box-shadow:0 3px 10px rgba(255,112,67,.55)}
#st .mb2{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;padding:10px 2px}
#st .mb2 i{font-style:normal;font-size:36px;line-height:1.1}
#st #cs{display:flex;flex-wrap:nowrap;gap:6px;width:100%}
#st #cs .cb{flex:1;font-size:30px;padding:8px 0}
#st .vb{flex:1;font-size:18px;padding:10px}
#st #go{width:100%;font-size:26px;padding:14px;border-radius:20px;margin-top:6px;background:linear-gradient(180deg,#66bb6a,#2e9e4f);box-shadow:0 5px 0 #1b7a38;animation:bp 1.6s infinite}
#st .how{font-size:13px;opacity:.75;font-weight:600;text-align:center}
@keyframes bp{50%{transform:scale(1.04)}}
